# First matching rule wins. Explicit sender rules always override AI labels.
rules:
  - id: trusted-employer
    when:
      sender_domain: company.example
    category: work
    priority: HIGH
    analyze: true
  - id: gmail-marketing
    when:
      labels: [CATEGORY_PROMOTIONS]
      list_unsubscribe: true
    category: newsletters
    priority: LOW
